# Interroge la base deux fois par semaine pour que Supabase ne mette pas le projet en pause.
name: Garder Supabase actif
on:
  schedule:
    - cron: "17 6 * * 1,4"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Requête légère vers la base
        run: |
          URL=$(grep -oP 'supabaseUrl:\s*"\K[^"]+' config.js)
          KEY=$(grep -oP 'supabaseKey:\s*"\K[^"]+' config.js)
          curl -sS -o /dev/null -w "Réponse : %{http_code}\n" "$URL/rest/v1/recipes?select=id&limit=1" -H "apikey: $KEY"
